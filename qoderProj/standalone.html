<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大衍筮法 - 数字化周易占卜</title>
    <style>
        /* 内嵌完整的CSS样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', '微软雅黑', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298, #1a237e);
            color: #ffffff;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .background-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            opacity: 0.6;
            animation: float 20s infinite linear;
        }

        .cloud1 {
            width: 200px;
            height: 60px;
            top: 20%;
            left: -200px;
            animation-duration: 25s;
        }

        .cloud2 {
            width: 150px;
            height: 45px;
            top: 60%;
            left: -150px;
            animation-duration: 30s;
        }

        .cloud3 {
            width: 180px;
            height: 55px;
            top: 80%;
            left: -180px;
            animation-duration: 35s;
        }

        @keyframes float {
            from { transform: translateX(0); }
            to { transform: translateX(calc(100vw + 200px)); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 0;
        }

        .title {
            margin-bottom: 20px;
        }

        .title-main {
            display: block;
            font-size: 3rem;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 10px;
        }

        .title-sub {
            display: block;
            font-size: 1.2rem;
            color: #e0e0e0;
            font-weight: normal;
        }

        .motto {
            font-style: italic;
            color: #b39ddb;
            font-size: 1.1rem;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .setup-card, .process-card, .result-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .setup-card h2, .process-card h2, .result-card h2 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .instruction {
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .question-input {
            margin-bottom: 30px;
        }

        .question-input label {
            display: block;
            margin-bottom: 10px;
            color: #e0e0e0;
        }

        .question-input textarea {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 1rem;
            resize: vertical;
            min-height: 100px;
        }

        .question-input textarea::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .start-btn, .primary-btn, .secondary-btn {
            display: block;
            margin: 0 auto;
            padding: 15px 40px;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #1a237e;
            border: none;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        }

        .start-btn:hover, .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.6);
        }

        .secondary-btn {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            margin-right: 15px;
        }

        .hexagram-visual {
            text-align: center;
            margin: 20px 0;
            font-family: monospace;
            font-size: 1.5rem;
        }

        .yao-line {
            margin: 5px 0;
            font-weight: bold;
        }

        .yang {
            color: #ffd700;
        }

        .yin {
            color: #90caf9;
        }

        .changing {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #b39ddb;
            font-size: 0.9rem;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .progress-container {
            margin: 20px 0;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ffed4e);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .title-main {
                font-size: 2rem;
            }
            
            .setup-card, .process-card, .result-card {
                padding: 20px;
            }
            
            .action-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .secondary-btn {
                margin-right: 0;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- 背景装饰 -->
    <div class="background-decoration">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
    </div>

    <!-- 主容器 -->
    <div class="container">
        <!-- 页面标题 -->
        <header class="header">
            <h1 class="title">
                <span class="title-main">大衍筮法</span>
                <span class="title-sub">数字化周易占卜</span>
            </h1>
            <p class="motto">"大衍之数五十，其用四九"</p>
        </header>

        <!-- 主要内容区域 -->
        <main class="main-content">
            <!-- 占卜准备区域 -->
            <section class="divination-setup" id="divination-setup">
                <div class="setup-card">
                    <h2>🧘‍♀️ 占卜准备</h2>
                    <p class="instruction">请静心思考您要占卜的问题，然后点击下方按钮开始筮法...</p>
                    
                    <div class="question-input">
                        <label for="question">您的问题（可选）：</label>
                        <textarea id="question" placeholder="请在此输入您要占卜的问题..."></textarea>
                    </div>
                    
                    <button class="start-btn" onclick="startDivination()">
                        <span>🌟</span>
                        开始大衍筮法
                        <span>🌟</span>
                    </button>
                </div>
            </section>

            <!-- 占卜过程显示区域 -->
            <section class="divination-process" id="divination-process" style="display: none;">
                <div class="process-card">
                    <h2>⚡ 筮法进行中</h2>
                    <div class="progress-container">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress-fill"></div>
                        </div>
                        <div class="progress-text" id="progress-text">准备开始...</div>
                    </div>
                    
                    <div class="yao-generation" id="yao-generation">
                        <h3>爻的生成过程</h3>
                        <div class="yao-list" id="yao-list"></div>
                    </div>
                </div>
            </section>

            <!-- 卦象结果显示区域 -->
            <section class="hexagram-result" id="hexagram-result" style="display: none;">
                <div class="result-card">
                    <h2>🔮 卦象结果</h2>
                    
                    <div class="hexagram-display" id="hexagram-display">
                        <div class="hexagram-visual" id="hexagram-visual"></div>
                        <div class="hexagram-info">
                            <h3 id="hexagram-name">卦名加载中...</h3>
                            <div class="trigram-info">
                                <div class="trigram">
                                    <span>上卦：</span>
                                    <span id="upper-trigram">-</span>
                                    <span id="upper-symbol">-</span>
                                </div>
                                <div class="trigram">
                                    <span>下卦：</span>
                                    <span id="lower-trigram">-</span>
                                    <span id="lower-symbol">-</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="hexagram-explanation" id="hexagram-explanation">
                        <div class="explanation-section">
                            <h4>📜 卦辞</h4>
                            <p id="gua-ci">加载中...</p>
                        </div>
                        <div class="explanation-section">
                            <h4>🎯 断语</h4>
                            <p id="judgment">加载中...</p>
                        </div>
                        <div class="explanation-section">
                            <h4>🖼️ 象辞</h4>
                            <p id="image">加载中...</p>
                        </div>
                        <div class="explanation-section" id="changing-yaos-section" style="display: none;">
                            <h4>⚡ 变爻提示</h4>
                            <p id="changing-yaos">无变爻</p>
                        </div>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="primary-btn" onclick="resetDivination()">再次占卜</button>
                    </div>
                </div>
            </section>
        </main>

        <!-- 页脚 -->
        <footer class="footer">
            <p>📚 本程序仅供学习和娱乐使用，具体卦象解释请参考《易经》相关典籍</p>
            <p>🙏 传承中华优秀传统文化，理性对待占卜结果</p>
        </footer>
    </div>

        // 卦象名称对照表
        const GUA_NAMES = {
            "111": "乾", "000": "坤", "100": "震", "011": "巽",
            "010": "坎", "101": "离", "001": "艮", "110": "兑"
        };

        // 爻象含义
        const YAO_MEANINGS = {
            6: "老阴（--✕--）变爻",
            7: "少阳（━━━━━）",
            8: "少阴（━━ ━━）", 
            9: "老阳（--○--）变爻"
        };

        // 大衍筮法核心类
        class DaYanShiFa {
            constructor() {
                this.hexagram = [];
                this.processInfo = [];
            }

            // 生成随机数
            random(min, max) {
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }

            // 延时函数
            sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            // 单次变化（三变法的一次）
            singleChange(sticks) {
                // 分二
                const leftPile = this.random(1, sticks - 1);
                const rightPile = sticks - leftPile;
                
                // 挂一
                const hangYi = 1;
                let remaining = sticks - hangYi;
                
                // 揲四（左堆）
                const leftQuotient = Math.floor((leftPile - hangYi) / 4);
                const leftRemainder = (leftPile - hangYi) % 4;
                const leftTaken = leftRemainder === 0 ? 4 : leftRemainder;
                
                // 揲四（右堆）
                const rightQuotient = Math.floor(rightPile / 4);
                const rightRemainder = rightPile % 4;
                const rightTaken = rightRemainder === 0 ? 4 : rightRemainder;
                
                const totalTaken = hangYi + leftTaken + rightTaken;
                remaining = sticks - totalTaken;
                
                return [remaining, totalTaken];
            }

            // 获取一爻的值
            getYaoValue() {
                let sticks = 49;
                const takenList = [];
                
                for (let i = 0; i < 3; i++) {
                    const [remaining, taken] = this.singleChange(sticks);
                    sticks = remaining;
                    takenList.push(taken);
                }
                
                // 根据最终剩余蓍草数确定爻值
                let yaoValue;
                if (sticks === 36) yaoValue = 9;      // 老阳
                else if (sticks === 32) yaoValue = 8;  // 少阴
                else if (sticks === 28) yaoValue = 7;  // 少阳
                else if (sticks === 24) yaoValue = 6;  // 老阴
                else yaoValue = 7; // 默认值
                
                return [yaoValue, takenList];
            }

            // 生成完整的六爻卦象
            async generateHexagram(progressCallback) {
                this.hexagram = [];
                
                for (let i = 0; i < 6; i++) {
                    // 更新进度
                    if (progressCallback) {
                        progressCallback({
                            current: i + 1,
                            total: 6,
                            message: `正在求第${i + 1}爻...`
                        });
                    }
                    
                    await this.sleep(800); // 添加延迟增加仪式感
                    
                    const [yaoValue, takenList] = this.getYaoValue();
                    this.hexagram.push(yaoValue);
                    
                    // 更新爻的显示
                    this.updateYaoDisplay(i + 1, yaoValue, takenList);
                }
                
                return { hexagram: this.hexagram };
            }

            // 更新爻的显示
            updateYaoDisplay(yaoNumber, yaoValue, takenList) {
                const yaoList = document.getElementById('yao-list');
                
                let yaoItem = document.getElementById(`yao-item-${yaoNumber}`);
                if (!yaoItem) {
                    yaoItem = document.createElement('div');
                    yaoItem.className = 'yao-item';
                    yaoItem.id = `yao-item-${yaoNumber}`;
                    yaoList.appendChild(yaoItem);
                }
                
                const isChanging = yaoValue === 6 || yaoValue === 9;
                const yaoSymbol = this.getYaoSymbol(yaoValue);
                
                yaoItem.innerHTML = `
                    <div class="yao-position">第${yaoNumber}爻</div>
                    <div class="yao-process">三次变化：取出蓍草 ${takenList.join(', ')}</div>
                    <div class="yao-result ${isChanging ? 'changing' : ''}" title="${YAO_MEANINGS[yaoValue]}">
                        ${yaoSymbol}
                    </div>
                `;
            }

            // 获取爻的符号表示
            getYaoSymbol(yaoValue) {
                switch (yaoValue) {
                    case 9: return '━━━━━━━ ○'; // 老阳
                    case 8: return '━━━  ━━━';   // 少阴
                    case 7: return '━━━━━━━';   // 少阳
                    case 6: return '━━━  ━━━ ✕'; // 老阴
                    default: return '━━━━━━━';
                }
            }

            // 获取三爻卦名
            getTrigramName(trigram) {
                const binaryTrigram = trigram.map(yao => yao % 2).join('');
                return GUA_NAMES[binaryTrigram] || "未知卦";
            }

            // 分析卦象
            analyzeHexagram(hexagram) {
                const lowerTrigram = hexagram.slice(0, 3);
                const upperTrigram = hexagram.slice(3, 6);
                
                const lowerName = this.getTrigramName(lowerTrigram);
                const upperName = this.getTrigramName(upperTrigram);
                
                // 注意顺序：HEXAGRAM_DATABASE 的键为「下卦+上卦」
                const guaKey = lowerName + upperName;
                const guaInfo = HEXAGRAM_DATABASE[guaKey] || {
                    name: `${upperName}上${lowerName}下`,
                    number: 0,
                    gua_ci: "卦辞信息完整版本请参考gua_database.py",
                    judgment: "完整的判断和解释请参考Python版本数据库",
                    image: "完整的象辞请参考传统典籍"
                };
                
                const changingYaos = [];
                for (let i = 0; i < hexagram.length; i++) {
                    if (hexagram[i] === 6 || hexagram[i] === 9) {
                        changingYaos.push(i + 1);
                    }
                }
                
                return {
                    lowerTrigram: lowerName,
                    upperTrigram: upperName,
                    fullName: guaInfo.name,
                    changingYaos: changingYaos,
                    hexagramValues: hexagram,
                    guaInfo: guaInfo
                };
            }

            // 显示卦象图形
            displayHexagram(hexagram) {
                const visual = document.getElementById('hexagram-visual');
                visual.innerHTML = '';
                
                // 从上到下显示（第6爻到第1爻）
                for (let i = 5; i >= 0; i--) {
                    const yao = hexagram[i];
                    const yaoDiv = document.createElement('div');
                    yaoDiv.className = 'yao-line';
                    
                    if (yao % 2 === 1) { // 阳爻
                        yaoDiv.innerHTML = yao === 9 ? '━━━━━━━ ○' : '━━━━━━━';
                        yaoDiv.className += ' yang';
                    } else { // 阴爻
                        yaoDiv.innerHTML = yao === 6 ? '━━━  ━━━ ✕' : '━━━  ━━━';
                        yaoDiv.className += ' yin';
                    }
                    
                    if (yao === 6 || yao === 9) {
                        yaoDiv.className += ' changing';
                    }
                    
                    visual.appendChild(yaoDiv);
                }
            }

            sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }
        }

        // 全局变量
        let diviner;
        let currentHexagram = null;
        let currentAnalysis = null;
        let isInProgress = false;

        // 开始占卜（主入口函数）
        async function startDivination() {
            console.log('开始占卜函数被调用');
            
            if (isInProgress) {
                console.log('占卜正在进行中，请稍候...');
                alert('占卜正在进行中，请稍候...');
                return;
            }
            
            try {
                isInProgress = true;
                console.log('设置占卜进行状态');
                
                // 隐藏准备区域，显示过程区域
                console.log('切换显示区域');
                document.getElementById('divination-setup').style.display = 'none';
                document.getElementById('divination-process').style.display = 'block';
                
                // 滚动到过程区域
                document.getElementById('divination-process').scrollIntoView({ 
                    behavior: 'smooth' 
                });
                
                console.log('开始执行占卜过程');
                // 执行占卜过程
                await performDivination();
                
            } catch (error) {
                console.error('占卜过程发生错误:', error);
                alert('占卜过程中发生错误：' + error.message);
                resetDivination();
            } finally {
                isInProgress = false;
                console.log('占卜过程结束');
            }
        }

        // 显示占卜结果
        function displayResult(analysis) {
            // 显示卦象图形
            diviner.displayHexagram(analysis.hexagramValues);
            
            // 显示卦象信息
            document.getElementById('hexagram-name').textContent = analysis.fullName;
            document.getElementById('upper-trigram').textContent = analysis.upperTrigram;
            document.getElementById('lower-trigram').textContent = analysis.lowerTrigram;
            document.getElementById('upper-symbol').textContent = BAGUA_INFO[analysis.upperTrigram]?.symbol || '';
            document.getElementById('lower-symbol').textContent = BAGUA_INFO[analysis.lowerTrigram]?.symbol || '';
            
            // 显示卦象解释
            document.getElementById('gua-ci').textContent = analysis.guaInfo.gua_ci;
            document.getElementById('judgment').textContent = analysis.guaInfo.judgment;
            document.getElementById('image').textContent = analysis.guaInfo.image;
            
            // 显示变爻信息
            if (analysis.changingYaos.length > 0) {
                document.getElementById('changing-yaos-section').style.display = 'block';
                document.getElementById('changing-yaos').textContent = 
                    `第${analysis.changingYaos.join(', ')}爻为变爻，代表事态发展的关键转折点，需特别关注。`;
            } else {
                document.getElementById('changing-yaos-section').style.display = 'none';
            }
        }

        // 更新进度显示
        function updateProgress(percentage, message) {
            const progressFill = document.getElementById('progress-fill');
            const progressText = document.getElementById('progress-text');
            
            if (progressFill) {
                progressFill.style.width = percentage + '%';
            }
            
            if (progressText) {
                progressText.textContent = message;
            }
        }

        // 保存结果功能
        function saveResult() {
            if (!currentAnalysis) return;
            
            const question = document.getElementById('question').value || '未记录问题';
            const timestamp = new Date().toLocaleString('zh-CN');
            
            const resultData = {
                timestamp: timestamp,
                question: question,
                hexagram: currentAnalysis.fullName,
                upperTrigram: currentAnalysis.upperTrigram,
                lowerTrigram: currentAnalysis.lowerTrigram,
                guaCi: currentAnalysis.guaInfo.gua_ci,
                judgment: currentAnalysis.guaInfo.judgment,
                image: currentAnalysis.guaInfo.image,
                changingYaos: currentAnalysis.changingYaos
            };
            
            // 保存到本地存储
            let savedResults = JSON.parse(localStorage.getItem('divinationResults') || '[]');
            savedResults.unshift(resultData);
            
            // 只保留最近20次结果
            if (savedResults.length > 20) {
                savedResults = savedResults.slice(0, 20);
            }
            
            localStorage.setItem('divinationResults', JSON.stringify(savedResults));
            
            alert('占卜结果已保存！您可以在浏览器的本地存储中查看历史记录。');
        }

        // 重置占卜
        function resetDivination() {
            document.getElementById('hexagram-result').style.display = 'none';
            document.getElementById('divination-process').style.display = 'none';
            document.getElementById('divination-setup').style.display = 'block';
            
            // 清空问题输入
            document.getElementById('question').value = '';
            
            // 重置全局变量
            currentHexagram = null;
            currentAnalysis = null;
            isInProgress = false;
            
            // 重新创建占卜实例
            diviner = new DaYanShiFa();
        }

        // 完成占卜的主流程
        async function performDivination() {
            try {
                // 重置进度和显示
                updateProgress(0, '准备蓍草...');
                document.getElementById('yao-list').innerHTML = '';
                
                await diviner.sleep(1000);
                
                // 生成卦象
                const result = await diviner.generateHexagram((progress) => {
                    const percentage = (progress.current / progress.total) * 100;
                    updateProgress(percentage, progress.message);
                });
                
                currentHexagram = result.hexagram;
                
                // 完成占卜过程
                updateProgress(100, '占卜完成！');
                await diviner.sleep(1000);
                
                // 分析卦象
                currentAnalysis = diviner.analyzeHexagram(currentHexagram);
                
                // 显示结果
                showResult();
                
            } catch (error) {
                console.error('占卜过程出错:', error);
                alert('占卜过程中发生错误，请重试。');
                resetDivination();
            }
        }

        // 显示最终结果
        function showResult() {
            // 隐藏过程区域，显示结果区域
            document.getElementById('divination-process').style.display = 'none';
            document.getElementById('hexagram-result').style.display = 'block';
            
            // 显示卦象图形
            diviner.displayHexagram(currentAnalysis.hexagramValues);
            
            // 显示卦象信息
            document.getElementById('hexagram-name').textContent = currentAnalysis.fullName;
            document.getElementById('upper-trigram').textContent = currentAnalysis.upperTrigram;
            document.getElementById('lower-trigram').textContent = currentAnalysis.lowerTrigram;
            document.getElementById('upper-symbol').textContent = BAGUA_INFO[currentAnalysis.upperTrigram]?.symbol || '';
            document.getElementById('lower-symbol').textContent = BAGUA_INFO[currentAnalysis.lowerTrigram]?.symbol || '';
            
            // 显示卦象解释
            document.getElementById('gua-ci').textContent = currentAnalysis.guaInfo.gua_ci;
            document.getElementById('judgment').textContent = currentAnalysis.guaInfo.judgment;
            document.getElementById('image').textContent = currentAnalysis.guaInfo.image;
            
            // 显示变爻信息
            if (currentAnalysis.changingYaos.length > 0) {
                document.getElementById('changing-yaos-section').style.display = 'block';
                document.getElementById('changing-yaos').textContent = 
                    `第${currentAnalysis.changingYaos.join(', ')}爻为变爻，代表事态发展的关键转折点，需特别关注。`;
            } else {
                document.getElementById('changing-yaos-section').style.display = 'none';
            }
        }

        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('大衍筮法程序已加载');
            console.log('支持完整的六十四卦数据库和传统筮法算法');
            
            // 初始化占卜实例
            diviner = new DaYanShiFa();
            
            // 添加字数统计功能
            const questionTextarea = document.getElementById('question');
            if (questionTextarea) {
                questionTextarea.addEventListener('input', function() {
                    const maxLength = 200;
                    const currentLength = this.value.length;
                    
                    let counter = document.getElementById('char-counter');
                    if (!counter) {
                        counter = document.createElement('div');
                        counter.id = 'char-counter';
                        counter.style.cssText = 'text-align: right; font-size: 0.9rem; color: #daa520; margin-top: 5px;';
                        this.parentNode.appendChild(counter);
                    }
                    
                    counter.textContent = `${currentLength}/${maxLength}`;
                    if (currentLength > maxLength) {
                        counter.style.color = '#ff6b6b';
                        this.value = this.value.substring(0, maxLength);
                        counter.textContent = `${maxLength}/${maxLength}`;
                    } else {
                        counter.style.color = '#daa520';
                    }
                });
            }
        });
    </script>
</body>
</html>
